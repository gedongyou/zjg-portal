<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="images/emblem-64.png">
<title>张家港市中等专业学校 · 门户网站</title>
<style>
  :root{
    --ink:#12233a; --ink-2:#3d5266; --ink-3:#8a9aab;
    --blue:#1a5fa8; --blue-deep:#0d3f75; --cyan:#2aa8c4;
    --gold:#c08a2e; --paper:#f6f7f9; --line:#e2e6ec; --seal:#b0342a;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-size:14px;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{width:1180px;margin:0 auto;}
  h1,h2,h3,h4{margin:0;}

  header.site{background:#fff;border-bottom:3px solid var(--blue);}
  header.site .wrap{display:flex;align-items:center;gap:22px;height:112px;}
  .logo{
    width:62px;height:62px;flex:0 0 62px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#3f8fd0,var(--blue-deep) 70%);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
    font-size:15px;letter-spacing:1px;box-shadow:0 2px 10px rgba(13,63,117,.28);text-align:center;line-height:1.15;
  }
  .sitename .cn{font-size:29px;font-weight:700;letter-spacing:1.5px;color:var(--blue-deep);font-family:"Source Han Serif SC","Songti SC","SimSun",serif;}
  .sitename .en{font-size:11px;letter-spacing:1.6px;color:#8a9aab;text-transform:uppercase;margin-top:4px;}
  .sitename .sub{font-size:12.5px;color:var(--ink-2);margin-top:5px;letter-spacing:.5px;}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .searchbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fafbfc;}
  .searchbox input{border:0;background:transparent;outline:none;padding:8px 14px;font-size:13px;width:150px;font-family:inherit;color:var(--ink);}
  .searchbox button{border:0;background:var(--blue);color:#fff;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .wxblock{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);}
  .qr-wrap{display:inline-block;line-height:0;position:relative;}
  .qr{width:48px;height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:2px;
    object-fit:contain;transform-origin:100% 0;cursor:zoom-in;
    transition:transform .32s cubic-bezier(.2,.8,.3,1),box-shadow .32s,border-color .32s;}
  .qr-wrap:hover .qr,.qr-wrap:focus-within .qr{transform:scale(2.7);border-color:#c6d8ea;
    box-shadow:0 18px 44px rgba(10,32,58,.30);position:relative;z-index:90;}

  nav.main{background:linear-gradient(180deg,var(--blue),#165391);box-shadow:0 2px 8px rgba(13,63,117,.18);position:relative;z-index:5;}
  nav.main .wrap{display:flex;height:50px;}
  nav.main a.item{
    flex:1;display:flex;align-items:center;justify-content:center;color:#eaf2fa;font-size:16px;
    letter-spacing:1.2px;border-right:1px solid rgba(255,255,255,.13);transition:background .18s;
  }
  nav.main a.item:first-child{border-left:1px solid rgba(255,255,255,.13);}
  nav.main a.item:hover,nav.main a.item.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700;}

  .quick{background:#fff;border-bottom:1px solid var(--line);}
  .quick .wrap{display:flex;align-items:center;height:46px;gap:8px;}
  .quick .lbl{font-size:12.5px;color:#9aa7b5;letter-spacing:1px;margin-right:10px;white-space:nowrap;}
  .quick .chip{font-size:13px;color:var(--ink-2);padding:5px 13px;border-radius:14px;background:#f1f4f8;border:1px solid #e7ecf2;white-space:nowrap;}
  .quick .chip:hover{background:var(--blue);color:#fff;border-color:var(--blue);}

  .hero{position:relative;height:380px;overflow:hidden;background:#0d3f75;}
  .hero .bg{position:absolute;inset:0;
    background:radial-gradient(ellipse at 78% 34%,rgba(42,168,196,.42),transparent 58%),
               linear-gradient(115deg,#0a2f58,#124b8a 46%,#1b6fa8 74%,#2aa8c4);}
  .hero .deco{position:absolute;inset:0;opacity:.05;
    background-image:repeating-linear-gradient(63deg,rgba(255,255,255,.5) 0 1.2px,transparent 1.2px 34px),
                     repeating-linear-gradient(-63deg,rgba(255,255,255,.35) 0 1.2px,transparent 1.2px 34px);}
  .hero .glow{position:absolute;right:-90px;bottom:-160px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(192,138,46,.30),transparent 62%);}
  .hero .wrap{position:relative;height:100%;display:flex;align-items:center;}
  .hero-txt{color:#fff;max-width:660px;}
  .hero-txt .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:2px;
    color:#bcd8ef;border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:5px 12px;margin-bottom:20px;}
  .hero-txt h1{font-size:46px;line-height:1.24;margin-bottom:14px;letter-spacing:3px;font-weight:700;
    font-family:"Source Han Serif SC","Songti SC","SimSun",serif;text-shadow:0 3px 18px rgba(0,0,0,.28);}
  .hero-txt h1 em{font-style:normal;color:#ffd98a;}
  .hero-txt p{font-size:15px;line-height:1.9;color:#cfe2f2;margin:0 0 24px;}
  .hero-btns{display:flex;gap:12px;}
  .btn{font-size:14px;padding:11px 26px;border-radius:2px;letter-spacing:1px;display:inline-block;transition:.18s;border:0;cursor:pointer;font-family:inherit;}
  .btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 14px rgba(192,138,46,.35);}
  .btn.gold:hover{background:#a97523;}
  .btn.ghost{border:1px solid rgba(255,255,255,.5);color:#fff;background:transparent;}
  .btn.ghost:hover{background:rgba(255,255,255,.14);}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn.line{border:1px solid var(--line);color:var(--ink-2);background:#fff;}
  .hero-side{margin-left:auto;width:296px;background:rgba(8,32,58,.55);border:1px solid rgba(255,255,255,.18);
    border-radius:4px;padding:18px 20px 16px;color:#dbe9f6;}
  .hero-side .t{font-size:14px;letter-spacing:1.5px;color:#fff;border-bottom:1px solid rgba(255,255,255,.2);
    padding-bottom:10px;margin-bottom:10px;display:flex;justify-content:space-between;}
  .hero-side .t span{font-size:11px;color:#9fc2dd;letter-spacing:.5px;}
  .hero-side ul{list-style:none;margin:0;padding:0;}
  .hero-side li{font-size:13px;line-height:1.5;padding:9px 0 9px 14px;border-bottom:1px dashed rgba(255,255,255,.12);
    position:relative;color:#cfdeec;cursor:pointer;}
  .hero-side li:hover{color:#fff;}
  .hero-side li:last-child{border-bottom:0;}
  .hero-side li::before{content:"";position:absolute;left:0;top:16px;width:4px;height:4px;background:var(--gold);border-radius:50%;}
  .hero-side li b{color:#fff;font-weight:600;}

  .stats{background:#0a2c50;color:#dceaf7;}
  .stats .wrap{display:flex;height:86px;}
  .stats .st{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid rgba(255,255,255,.10);}
  .stats .st:last-child{border-right:0;}
  .stats .st .num{font-size:27px;font-weight:700;color:#fff;letter-spacing:.5px;}
  .stats .st .num small{font-size:13px;font-weight:400;color:#8fb4d4;margin-left:3px;}
  .stats .st .lab{font-size:12.5px;color:#9dbdd8;margin-top:5px;letter-spacing:1px;}

  .main-area{background:var(--paper);padding:28px 0 34px;}
  .main-area .wrap{display:grid;grid-template-columns:1fr 340px;gap:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:2px;}
  .card-hd{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:50px;border-bottom:2px solid var(--blue);}
  .card-hd .ttl{font-size:17px;font-weight:700;color:var(--blue-deep);letter-spacing:1.2px;display:flex;align-items:center;gap:9px;}
  .card-hd .ttl::before{content:"";width:4px;height:17px;background:var(--gold);display:block;}
  .card-hd .more{font-size:12.5px;color:#93a2b2;letter-spacing:.5px;}
  .card-hd .more:hover{color:var(--blue);}

  .news{display:grid;grid-template-columns:1fr 1fr;}
  .news .col{padding:6px 18px 12px;}
  .news .col:first-child{border-right:1px dashed var(--line);}
  .tabs{display:flex;gap:6px;padding:12px 0 6px;}
  .tabs .tab{font-size:13.5px;padding:6px 13px;color:var(--ink-2);border-radius:2px;cursor:pointer;
    text-decoration:none;display:inline-block;transition:.2s;}
  .tabs .tab.on{background:#eaf2fa;color:var(--blue-deep);font-weight:700;}
  .newslist{list-style:none;margin:0;padding:0;}
  .newslist li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dotted #e8ecf1;font-size:14px;}
  .newslist li:last-child{border-bottom:0;}
  .newslist .date{flex:0 0 54px;text-align:center;background:#f5f8fb;border:1px solid #e8eef5;border-radius:2px;padding:4px 0;line-height:1.1;}
  .newslist .date b{display:block;font-size:16px;color:var(--blue);font-weight:700;}
  .newslist .date span{font-size:10.5px;color:#9fb0c0;}
  .newslist .txt{flex:1;line-height:1.55;color:var(--ink);}
  .newslist .txt:hover{color:var(--blue);}
  .newslist .txt i{font-style:normal;display:block;font-size:11.5px;color:#a3b1bf;margin-top:3px;}
  .tag-hot{display:inline-block;font-size:10.5px;color:#fff;background:var(--seal);padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px;letter-spacing:.5px;}

  .zs-strip{margin-top:20px;background:linear-gradient(100deg,#0d3f75,#1a5fa8 62%,#22779f);
    border-radius:2px;color:#fff;display:flex;align-items:center;padding:22px 26px;gap:26px;position:relative;overflow:hidden;}
  .zs-strip .deco{position:absolute;right:-40px;top:-70px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,255,255,.06);}
  .zs-strip h3{font-size:21px;letter-spacing:2px;font-family:"Source Han Serif SC","SimSun",serif;}
  .zs-strip p{margin:7px 0 0;font-size:12.5px;color:#c3daee;line-height:1.7;white-space:nowrap;}
  .zs-strip .acts{margin-left:auto;display:flex;gap:10px;position:relative;flex:0 0 auto;}
  .zs-strip .acts a{font-size:13px;padding:9px 18px;border:1px solid rgba(255,255,255,.4);border-radius:2px;white-space:nowrap;}
  .zs-strip .acts a.pri{background:var(--gold);border-color:var(--gold);}

  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
  .svc{background:#fff;padding:18px 6px 15px;text-align:center;font-size:13px;color:var(--ink-2);transition:.15s;}
  .svc:hover{background:#f2f8ff;color:var(--blue-deep);}
  .svc .ic{width:34px;height:34px;margin:0 auto 9px;border-radius:8px;
    background:linear-gradient(145deg,#e8f1fa,#dbe9f7);border:1px solid #d3e3f2;
    display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:15px;font-weight:700;}

  .dept{padding:14px 18px 18px;}
  .dept .d{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;
    border:1px solid #eef2f6;border-left:3px solid var(--cyan);border-radius:2px;margin-bottom:9px;
    font-size:13.5px;background:#fcfdfe;}
  .dept .d:hover{border-left-color:var(--gold);background:#fffdf7;}
  .dept .d span{color:#9dabb9;font-size:11.5px;text-align:right;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0;}

  .wuxin{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:30px 0 34px;}
  .wuxin .head{text-align:center;margin-bottom:22px;}
  .wuxin .head h2{font-size:25px;letter-spacing:5px;color:var(--blue-deep);font-family:"Source Han Serif SC","SimSun",serif;font-weight:700;}
  .wuxin .head .en{font-size:11px;letter-spacing:2.5px;color:#b3bfca;margin-top:7px;text-transform:uppercase;}
  .wuxin .head .ln{width:56px;height:3px;background:var(--gold);margin:14px auto 0;}
  .wx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .wx{border:1px solid var(--line);border-radius:2px;padding:22px 18px 20px;background:#fff;position:relative;transition:.2s;overflow:hidden;}
  .wx:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(18,35,58,.10);border-color:#cfdce9;}
  .wx .no{font-size:11px;letter-spacing:1.5px;color:#b9c5d1;}
  .wx .cn{font-size:23px;font-weight:700;letter-spacing:3px;color:var(--ink);margin:6px 0 4px;font-family:"Source Han Serif SC","SimSun",serif;}
  .wx .cn u{text-decoration:none;color:var(--seal);}
  .wx .py{font-size:11px;letter-spacing:2px;color:#aab7c4;text-transform:uppercase;}
  .wx .desc{font-size:12.5px;line-height:1.85;color:#63748a;margin-top:12px;padding-top:12px;border-top:1px dashed #e7ecf1;}
  .wx .bar{position:absolute;left:0;top:0;width:100%;height:3px;background:var(--blue);}
  .wx:nth-child(2) .bar{background:var(--seal);}
  .wx:nth-child(3) .bar{background:#2f7c5a;}
  .wx:nth-child(4) .bar{background:var(--gold);}
  .wx:nth-child(5) .bar{background:var(--cyan);}

  footer.site{background:#0c2038;color:#8fa5bd;padding:34px 0 0;font-size:13px;}
  footer.site .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:30px;padding-bottom:26px;}
  footer.site h4{color:#e3edf7;font-size:14px;letter-spacing:1.5px;margin-bottom:14px;font-weight:700;}
  footer.site p{margin:0 0 8px;line-height:1.9;font-size:12.5px;}
  footer.site ul{list-style:none;margin:0;padding:0;}
  footer.site li{margin-bottom:9px;font-size:12.5px;}
  footer.site li a:hover{color:#fff;}
  footer.site .flogo{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  footer.site .flogo .m{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#3f8fd0,#0d3f75);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
  footer.site .flogo .n{color:#fff;font-size:16px;letter-spacing:1px;font-weight:700;}
  .copy{border-top:1px solid rgba(255,255,255,.09);padding:14px 0;text-align:center;font-size:12px;color:#6f849b;}

  .subhero{background:linear-gradient(115deg,#0a2f58,#124b8a 55%,#1b6fa8);color:#fff;padding:42px 0 38px;position:relative;overflow:hidden;}
  .subhero .deco{position:absolute;inset:0;opacity:.16;
    background-image:repeating-linear-gradient(63deg,rgba(255,255,255,.5) 0 1.2px,transparent 1.2px 34px);}
  .subhero h1{font-size:34px;letter-spacing:4px;font-family:"Source Han Serif SC","SimSun",serif;position:relative;}
  .subhero .en{font-size:11.5px;letter-spacing:2.5px;color:#9fc2dd;margin-top:10px;text-transform:uppercase;position:relative;}
  .crumb{background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3);}
  .crumb .wrap{height:42px;display:flex;align-items:center;gap:6px;}
  .crumb a:hover{color:var(--blue);}
  .crumb b{color:var(--ink);font-weight:500;}

  .page-body{padding:28px 0 40px;}
  .side-nav{background:#fff;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .side-nav .h{background:#f5f8fb;border-bottom:1px solid var(--line);padding:14px 18px;font-size:15px;
    font-weight:700;color:var(--blue-deep);letter-spacing:1px;border-left:3px solid var(--gold);}
  .side-nav a{display:block;padding:12px 18px;font-size:13.5px;color:var(--ink-2);border-bottom:1px dotted #eef2f6;}
  .side-nav a:hover{background:#f7fbff;color:var(--blue);}
  .side-nav a.on{background:#eef5fc;color:var(--blue-deep);font-weight:700;border-left:3px solid var(--blue);}
  .two-col{display:grid;grid-template-columns:236px 1fr;gap:24px;}

  .art{background:#fff;border:1px solid var(--line);padding:34px 44px 40px;}
  .art h1{font-size:25px;line-height:1.5;text-align:center;font-weight:700;letter-spacing:.5px;color:#16283c;}
  .art .meta{text-align:center;font-size:12.5px;color:var(--ink-3);margin:16px 0 22px;padding-bottom:16px;border-bottom:1px solid #eef2f6;}
  .art .meta span{margin:0 10px;}
  .art p{font-size:15px;line-height:2.05;color:#2b3a4b;margin:0 0 16px;text-indent:2em;text-align:justify;}
  .art .ph{background:linear-gradient(135deg,#e8eef6,#d7e2ee);border:1px dashed #c2d1e0;border-radius:3px;
    height:190px;display:flex;align-items:center;justify-content:center;color:#8fa5bb;font-size:13px;
    margin:20px 0;letter-spacing:1px;}
  .art .pn{display:flex;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px dotted #dfe6ee;font-size:13px;color:var(--ink-2);}
  .art .pn a:hover{color:var(--blue);}

  .listbox{background:#fff;border:1px solid var(--line);}
  .listbox .li{display:flex;gap:20px;padding:22px;border-bottom:1px solid #eef2f6;}
  .listbox .li:hover{background:#fbfdff;}
  .listbox .thumb{width:168px;height:112px;flex:0 0 168px;border-radius:2px;
    background:linear-gradient(135deg,#dde7f2,#c9d9ea);position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:#8fa5bb;font-size:12px;}
  .listbox .thumb::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 1px,transparent 1px 12px);}
  .listbox .tx{flex:1;}
  .listbox h3{font-size:16.5px;line-height:1.5;margin-bottom:9px;font-weight:700;color:#17293d;}
  .listbox h3:hover{color:var(--blue);}
  .listbox .desc{font-size:13px;line-height:1.75;color:#6b7d90;margin-bottom:10px;}
  .listbox .info{font-size:12px;color:#a3b1bf;display:flex;gap:16px;}
  .pager{display:flex;justify-content:center;gap:7px;padding:22px 0 4px;}
  .pager a{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);padding:0 10px;}
  .pager a.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pager a:hover{border-color:var(--blue);color:var(--blue);}
  .pager a.on:hover{color:#fff;}
  .pager a.dis{color:#b9c2cc;background:#fafbfc;cursor:not-allowed;}
  .pager a.dis:hover{border-color:var(--line);color:#b9c2cc;}

  .prose{background:#fff;border:1px solid var(--line);padding:32px 40px;}
  .prose h2{font-size:19px;color:var(--blue-deep);letter-spacing:1px;margin:26px 0 14px;padding-left:12px;border-left:4px solid var(--gold);}
  .prose h2:first-child{margin-top:0;}
  .prose p{font-size:14.5px;line-height:2;color:#2b3a4b;margin:0 0 14px;text-indent:2em;text-align:justify;}
  .mu-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 4px;}
  .mu{background:#f8fbfe;border:1px solid #e8eff6;border-radius:2px;padding:16px 18px;}
  .mu b{display:block;font-size:15px;color:var(--blue-deep);letter-spacing:1px;margin-bottom:6px;}
  .mu span{font-size:12.5px;color:#6b7d90;line-height:1.9;}

  .major-tabs{display:flex;gap:0;background:#fff;border:1px solid var(--line);margin-bottom:18px;}
  .major-tabs .mt{flex:1;text-align:center;padding:15px 6px;font-size:14px;color:var(--ink-2);cursor:pointer;
    border-right:1px solid var(--line);border-bottom:3px solid transparent;}
  .major-tabs .mt:last-child{border-right:0;}
  .major-tabs .mt.on{color:var(--blue-deep);font-weight:700;border-bottom-color:var(--blue);background:#f7fbff;}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;align-items:start;}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:2px;overflow:hidden;transition:.2s;}
  .mcard:hover{box-shadow:0 8px 22px rgba(18,35,58,.09);border-color:#cfdce9;transform:translateY(-2px);}
  .mcard .top{height:104px;background:linear-gradient(135deg,#0d3f75,#1b6fa8 60%,#2aa8c4);
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);
    font-size:19px;letter-spacing:3px;font-family:"Source Han Serif SC","SimSun",serif;position:relative;}
  .mcard .top::after{content:"";position:absolute;inset:0;opacity:.2;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 1px,transparent 1px 14px);}
  .mcard .bd{padding:15px 17px 17px;}
  .mcard .tags{display:flex;gap:6px;margin-bottom:10px;}

function sideNav(title, groups, active, page, tip){
  const one = ([t,k,n])=>{
    const href = k.startsWith('#') ? k : `#/${page}/${encodeURIComponent(k)}`;
    return `<a class="${k===active?'on':''}" href="${href}"><span>${t}</span>${n!=null?`<i>${n}</i>`:''}</a>`;
  };
  return `<div class="side-nav"><div class="h">${title}</div>` +
    groups.map(g=>
      (g.h?`<div class="sh">${g.h}</div>`:'') + g.items.map(one).join('')
    ).join('') +
    (tip?`<div class="tip">${tip}</div>`:'') + `</div>`;
}

function catList(){
  const list = (Store.cats() || []).map(c=>c.name).filter(Boolean);
  const extra = [];
  NEWS.forEach(n=>{ if(n.cat && list.indexOf(n.cat)<0 && extra.indexOf(n.cat)<0) extra.push(n.cat); });
  return list.concat(extra);
}

function newsNav(active){
  const CATS = catList();
  const cnt = c => NEWS.filter(n=>n.cat===c).length;
  return sideNav('新闻中心',[
    {h:'', items:[['全部新闻','all',NEWS.length]].concat(CATS.map(c=>[c,c,cnt(c)]))},
    {h:'快速入口', items:[['招生信息','#/zs'],['专业设置','#/majors'],['进入后台','admin.html']]}

  '<b>投稿</b>：各部门信息员在后台提交，宣传部审核后发布<br><b>更新</b>：工作日每日更新');
}

  const pages = Math.max(1, Math.ceil(all.length / PAGE));
  let pg = parseInt(page, 10);
  if(!pg || pg < 1) pg = 1;
  if(pg > pages) pg = pages;
  const list = all.slice((pg - 1) * PAGE, pg * PAGE);
  const title = c || '全部新闻';
  const chips = ['', ...catList()].map(x=>{
    const on = (x||'')===c;
    const lab = x || '全部';
    const href = x ? `#/news/${encodeURIComponent(x)}` : '#/news/all';
    return `<a class="chip ${on?'on':''}" href="${href}">${lab}<i>${x?NEWS.filter(n=>n.cat===x).length:NEWS.length}</i></a>`;
  }).join('');

  return header('news') + subhero('新闻中心','NEWS CENTER') +
    crumb([{t:'新闻中心'},{t:title}]) + `
  <div class="page-body"><div class="wrap">
    <div class="two-col">
      ${newsNav(c||'all')}
      <div>
        <div class="chips">${chips}</div>
        <div class="listhd"><b>${title}</b><span>共 ${all.length} 条 · 按发布时间倒序 · 第 ${pg}/${pages} 页</span></div>
        ${list.length ? `<div class="listbox">
          ${list.map(n=>`
          <div class="li">
            <a class="thumb ${n.cover?'has':''}" href="#/news/${n.id}">${n.cover?`<img src="${n.cover}" alt="">`:'图片占位'}</a>
            <div class="tx">
              <a href="#/news/${n.id}"><h3>${n.title}</h3></a>
              <div class="desc">${n.desc}</div>
              <div class="info"><span>${n.year}-${n.date}</span><span>来源：${n.dept}</span><span>浏览 ${n.views}</span><span>${n.cat}</span></div>
            </div>
          </div>`).join('')}
        </div>` : `<div class="empty"><b>暂无内容</b><span>“${c}”栏目还没有发布文章，可登录后台新增，或先看看其他栏目。</span></div>`}
        ${all.length > PAGE ? `<div class="pager">${pg > 1 ? `<a href="#/news/${c ? encodeURIComponent(c) : 'all'}/p${pg - 1}">‹ 上一页</a>` : `<a class="dis">‹ 上一页</a>`}${Array.from({length: pages}, (_, i) => i + 1).map(i => i === pg ? `<a class="on">${i}</a>` : `<a href="#/news/${c ? encodeURIComponent(c) : 'all'}/p${i}">${i}</a>`).join('')}${pg < pages ? `<a href="#/news/${c ? encodeURIComponent(c) : 'all'}/p${pg + 1}">下一页 ›</a>` : `<a class="dis">下一页 ›</a>`}</div>` : ''}
      </div>
    </div>
  </div></div>` + footer();
}

function pgSearch(kw){
  const q = (kw || '').trim();
  const lower = q.toLowerCase();
  const hit = q ? NEWS.filter(n=>(n.title+' '+n.desc+' '+n.cat+' '+n.dept).toLowerCase().indexOf(lower) >= 0) : [];

  return header('search') + subhero('站内搜索','SITE SEARCH') +
    crumb([{t:'站内搜索'},{t:q || '全部'}]) + `

          <div class="li">

              <div class="desc">${hl(n.desc)}</div>
              <div class="info"><span>${n.year}-${n.date}</span><span>来源：${hl(n.dept)}</span><span>浏览 ${n.views}</span><span>${hl(n.cat)}</span></div>
            </div>
          </div>`).join('')}
        </div>` : `<div class="empty"><b>没有找到相关内容</b><span>换个关键词试试，例如“招生”“技能大赛”“五心”“实训”。</span></div>`}

const STATIC = /[?&]static=1/.test(location.search);
if(STATIC) document.documentElement.classList.add('no-anim');

function initReveal(){
  const els = Array.from(document.querySelectorAll(
    '.card,.wuxin,.wx,.mcard,.w5 .item,.art,.prose,.listbox,.zs-strip,.dept>.d,.wuxin .head,.wx-grid'
  ));
  if(!('IntersectionObserver' in window) || STATIC){
    els.forEach(el=>el.classList.add('reveal','in'));
    return;
  }
  els.forEach(el=>el.classList.add('reveal'));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  },{threshold:.06, rootMargin:'0px 0px -36px 0px'});
  els.forEach(el=>io.observe(el));
}

function stagger(sel,step){
  document.querySelectorAll(sel).forEach((el,i)=>{ el.style.transitionDelay=(i%9*step)+'ms'; });
}

function initCounters(){
  const nums = Array.from(document.querySelectorAll('.stats .st .num'));
  if(!nums.length) return;
  const run = (el)=>{
    const small = el.querySelector('small');
    const suffix = small ? small.outerHTML : '';
    const target = parseFloat(el.textContent) || 0;
    if(STATIC){ return; }
    const t0 = performance.now(), dur = 1150;
    const step = (t)=>{
      const p = Math.min(1,(t-t0)/dur);
      const v = Math.round(target * (1 - Math.pow(1-p,3)));
      el.innerHTML = v + suffix;
      if(p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  if(!('IntersectionObserver' in window) || STATIC){ nums.forEach(run); return; }
  const io = new IntersectionObserver((es)=>{
    es.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); run(en.target); } });
  },{threshold:.5});
  nums.forEach(n=>io.observe(n));
}

function initToTop(){
  if(document.getElementById('toTop')) return;
  const b = document.createElement('button');
  b.id = 'toTop'; b.className = 'to-top'; b.type = 'button';
  b.innerHTML = '↑'; b.title = '返回顶部'; b.setAttribute('aria-label','返回顶部');
  b.onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});
  document.body.appendChild(b);
  window.addEventListener('scroll',()=>{
    const y = window.scrollY || document.documentElement.scrollTop;
    b.classList.toggle('show', y > 480);
    document.querySelectorAll('nav.main').forEach(n=>n.classList.toggle('stuck', y > 130));
  },{passive:true});
}

const ZOOMS = [1,1.1,1.2,1.3,1.45];
let zoomIdx = 0;
try{ zoomIdx = Math.min(ZOOMS.length-1, Math.max(0, parseInt(localStorage.getItem('zjg_zoom')||'0',10)||0)); }catch(e){}
function applyZoom(){
  const z = ZOOMS[zoomIdx];
  document.documentElement.style.zoom = z === 1 ? '' : String(z);
  try{ localStorage.setItem('zjg_zoom', zoomIdx); }catch(e){}
  const lb = document.querySelector('.a11y-lb');
  if(lb) lb.textContent = z === 1 ? '字号' : Math.round(z*100) + '%';
}
applyZoom();
document.addEventListener('click',(e)=>{
  const b = e.target.closest('[data-fs]');
  if(!b) return;
  const a = b.dataset.fs;
  if(a === 'inc') zoomIdx = Math.min(ZOOMS.length-1, zoomIdx+1);
  if(a === 'dec') zoomIdx = Math.max(0, zoomIdx-1);
  if(a === 'reset') zoomIdx = 0;
  applyZoom();
});

function aiAnswer(q){
  const s = q.replace(/\s/g,'');
  let best = null, score = 0;
  AI_KB.forEach(item=>{
    let c = 0;
    item.k.forEach(k=>{ if(s.includes(k)) c += k.length + 1; });
    if(c > score){ score = c; best = item; }
  });
  return best;
}

function initAI(){
  const orb = document.createElement('button');
  orb.type = 'button'; orb.className = 'ai-orb'; orb.id = 'aiOrb'; orb.title = '智能问答（演示）';
  orb.innerHTML = '<b>AI</b><i>问答</i>';
  document.body.appendChild(orb);

  const panel = document.createElement('div');
  panel.className = 'ai-panel'; panel.id = 'aiPanel';
  panel.innerHTML = `
    <div class="ai-hd">
      <img src="images/emblem.png" alt="">
      <div><div class="t">张中小智 · 智能问答</div><div class="s">基于常见问题的智能应答 · 演示版</div></div>
      <div class="x" id="aiClose" title="收起">×</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-chips" id="aiChips"></div>
    <div class="ai-in">
      <input id="aiInput" type="text" placeholder="想问点什么？例如：怎么报名…" autocomplete="off">
      <button type="button" id="aiSend">发送</button>
    </div>
    <div class="ai-tip">演示问答，答案来自预设知识库，正式版可接入大模型接口</div>`;
  document.body.appendChild(panel);

  const body = panel.querySelector('#aiBody');
  const chips = panel.querySelector('#aiChips');
  const input = panel.querySelector('#aiInput');

  function push(text, me){
    const el = document.createElement('div');
    el.className = 'msg' + (me ? ' me' : '');
    el.innerHTML = `<i class="av">${me?'我':'AI'}</i><div class="bub">${text}</div>`;
    body.appendChild(el);
    body.scrollTop = body.scrollHeight;
    return el;
  }

  const greet = '你好，我是“张中小智”。<br>关于招生报名、专业设置、地址电话、收费标准、五心主题……都可以问我。';
  setTimeout(()=>{ if(!body.children.length) push(greet,false); }, 120);

  ['怎么报名？','有哪些专业？','学校地址在哪？','“五心”是什么？'].forEach(t=>{
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.onclick = ()=>ask(t);
    chips.appendChild(b);
  });

  function ask(text){
    const q = (text || input.value || '').trim();
    if(!q) return;
    push(q, true);
    input.value = '';
    const dots = push('<span class="dots"><span></span><span></span><span></span></span>', false);
    setTimeout(()=>{
      const hit = aiAnswer(q);
      dots.querySelector('.bub').innerHTML = hit
        ? hit.a
        : '这个问题我暂时答不上来。<br>你可以换个说法，或者拨打 0512-5866 xxxx 直接咨询，也可以到“校长信箱”留言。';
      body.scrollTop = body.scrollHeight;
    }, 620);
  }

  orb.onclick = ()=>{
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) setTimeout(()=>input.focus(), 320);
  };
  panel.querySelector('#aiClose').onclick = ()=>panel.classList.remove('open');
  panel.querySelector('#aiSend').onclick = ()=>ask();
  input.addEventListener('keydown',(e)=>{ if(e.key === 'Enter') ask(); });
  document.addEventListener('keydown',(e)=>{ if(e.key === 'Escape') panel.classList.remove('open'); });

  if(/[?&]ai=1/.test(location.search)){
    panel.classList.add('open');
    push('学校地址在哪？', true);
    push(AI_KB[2].a, false);
  }
}

function applySlide(){
  if(typeof Store === 'undefined' || !Store.activeSlide) return;
  const s = Store.activeSlide();
  const bg = document.querySelector('.hero .bg');
  if(!bg || !s) return;
  const grad = 'linear-gradient(100deg,rgba(4,20,38,.94) 0%,rgba(5,26,45,.88) 30%,rgba(6,32,54,.62) 56%,rgba(6,32,54,.26) 82%,rgba(6,32,54,.14) 100%)';
  bg.style.backgroundImage = grad + ', url("' + s + '")';
}

function route(){
  const prevKey = route._key || '';
  const prevY = window.pageYOffset || document.documentElement.scrollTop || 0;
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const raw = h.split('/');
  const k = raw[0] || 'home';
  let arg = raw[1] || '';
  try{ arg = decodeURIComponent(arg); }catch(e){}
  const app = document.getElementById('app');
  let html='';
  switch(k){
    case 'home': html=pgHome(); break;
    case 'news': html = /^\d+$/.test(arg) ? pgNewsDetail(arg) : pgNewsList(arg, raw[2] ? raw[2].replace(/^p/, '') : 1); break;
    case 'search': html = pgSearch(arg); break;
    case 'about': html=pgAbout(arg); break;
    case 'majors': html=pgMajors(); break;
    case 'wuxin': html=pgWuxin(); break;
    case 'zs': html=pgZs(arg); break;
    case 'teach': html=pgTeach(arg); break;
    case 'party': html=pgParty(arg); break;
    default: html=pgHome();
  }
  app.innerHTML = html;

  if(k==='majors'){
    renderMajors(Object.keys(MAJORS)[0]);
    document.querySelectorAll('.mt').forEach(t=>{
      t.onclick=()=>{
        document.querySelectorAll('.mt').forEach(x=>x.classList.remove('on'));
        t.classList.add('on');
        renderMajors(t.dataset.dept);
        initReveal(); stagger('.mcard',55);
      };
    });
  }

  initReveal();
  stagger('.wx',70);
  stagger('.mcard',55);
  stagger('.w5 .item',80);
  stagger('.dept>.d',45);
  initCounters();
  applyZoom();

  const same = prevKey === k && !(k === 'news' && /^\d+$/.test(arg));

  if(same){
    try{ window.scrollTo({top:prevY,left:0,behavior:'instant'}); }
    catch(e){ window.scrollTo(0,prevY); }
  }else{
    try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }
    catch(e){ window.scrollTo(0,0); }
  }

  if(arg && document.getElementById('sec-'+arg)){
    const el = document.getElementById('sec-'+arg);
    const y = el.getBoundingClientRect().top + (window.pageYOffset||0) - 78;
    try{ window.scrollTo({top:y,left:0,behavior:same?'smooth':'instant'}); }
    catch(e){ window.scrollTo(0,y); }
  }

  if(k === 'search'){
    const qi = document.getElementById('q');
    if(qi) qi.value = arg;
  }

  applySlide();
  route._key = k;
}
window.addEventListener('hashchange',route);

window.addEventListener('storage',function(e){
  if(!e.key || e.key.indexOf('zjg_portal') !== 0) return;
  NEWS = loadNews();
  route();
});

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState !== 'visible') return;
  const fresh = loadNews();
  if(fresh.length !== NEWS.length){ NEWS = fresh; route(); }
});

document.addEventListener('click',function(e){
  const a = e.target.closest ? e.target.closest('.side-nav a') : null;
  if(!a) return;
  const href = a.getAttribute('href') || '';
  if(href.slice(0,2) !== '#/') return;
  const parts = href.slice(2).split('/');
  const key = parts[0];
  let arg = parts[1] || '';
  if(!arg || key !== route._key) return;
  try{ arg = decodeURIComponent(arg); }catch(err){}
  const el = document.getElementById('sec-' + arg);
  if(!el) return;
  e.preventDefault();
  const y = el.getBoundingClientRect().top + (window.pageYOffset || 0) - 78;
  try{ window.scrollTo({top:y,left:0,behavior:'smooth'}); }
  catch(err){ window.scrollTo(0,y); }
  document.querySelectorAll('.side-nav a').forEach(function(x){ x.classList.remove('on'); });
  a.classList.add('on');
  try{ history.replaceState(null,'',href); }catch(err){}
});

route();
initAI();
initToTop();

setTimeout(()=>document.body.classList.add('force-show'),2600);

document.addEventListener('mousemove',(e)=>{
  if(STATIC) return;
  const deco = document.querySelector('.hero .deco');
  if(!deco) return;
  const dx = (e.clientX - window.innerWidth / 2) / window.innerWidth;
  const dy = (e.clientY - window.innerHeight / 2) / window.innerHeight;
  deco.style.transform = `translate3d(${(dx*16).toFixed(2)}px,${(dy*10).toFixed(2)}px,0)`;
},{passive:true});

</script>
